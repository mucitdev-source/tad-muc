<!DOCTYPE html>
<html>
  <head>
    <title>Tad</title>
    <meta charset="UTF-8" />
    <!--
      MUC hardening: Content Security Policy.
      No 'unsafe-inline' for scripts, so markup injected via data cells
      (inline event handlers such as onerror=, <script> tags) cannot run.
      Styles still need 'unsafe-inline' because the bundle and SlickGrid
      inject <style> elements at runtime.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
  </head>
  <body>
    <div id="app" class="full-height"></div>
  </body>
  <script src="tadapp.bundle.js"></script>
</html>
