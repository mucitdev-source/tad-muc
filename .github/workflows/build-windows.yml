# MUC: build and verify the hardened Tad installer for Windows.
#
# Runs on every push to muc-hardening and on demand (Actions -> Run workflow).
# The installer and its SHA-256 are published as a workflow artifact; nothing
# is uploaded to GitHub Releases and no secrets are used.

name: Build Tad MUC (Windows)

on:
  push:
    branches: [muc-hardening]
    # documentation-only changes do not need a new installer
    paths-ignore:
      - "**/*.md"
      - "doc/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      # no code-signing certificate is configured yet
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      # third-party actions are pinned to full commit SHAs
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install root tooling
        run: npm ci --no-audit --no-fund

      - name: Bootstrap packages used by the desktop app
        run: >
          npx lerna bootstrap --no-ci --hoist --force-local --ignore-prepublish
          --ignore tadweb-app --ignore tadweb-server --ignore reltab-sqlite
          --ignore reltab-bigquery --ignore reltab-snowflake --ignore reltab-aws-athena

      - name: Build libraries
        run: |
          foreach ($p in "reltab", "aggtree", "reltab-duckdb", "reltab-fs", "tadviewer") {
            Write-Host "=== building $p"
            Push-Location "packages/$p"
            npm run build
            if ($LASTEXITCODE -ne 0) { throw "build failed: $p" }
            Pop-Location
          }

      - name: Security regression test (query validator)
        run: node tools/muc-security/validator-test.js

      - name: Build and package the app
        working-directory: packages/tad-app
        run: |
          npm run build-prod
          if ($LASTEXITCODE -ne 0) { throw "build-prod failed" }
          npm run dist
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed" }

      - name: Verify Electron fuses and packaging
        run: |
          node tools/muc-security/check-fuses.js packages/tad-app/release/win-unpacked/Tad.exe
          if ($LASTEXITCODE -ne 0) { throw "fuse check failed" }
          $res = "packages/tad-app/release/win-unpacked/resources"
          if (Test-Path "$res/app-update.yml") { throw "app-update.yml must not be packaged" }
          if (-not (Test-Path "$res/app.asar.unpacked/node_modules/duckdb/lib/binding/duckdb.node")) { throw "DuckDB native module missing" }

      - name: Runtime security test helpers
        run: |
          New-Item -ItemType Directory -Force runtime-test | Out-Null
          @'
          # Opens payload-xss.csv in a Tad executable and reports what happened.
          param([string]$Exe, [string]$Label, [int]$Wait = 60)
          $ErrorActionPreference = "Stop"
          $csv = (Resolve-Path "tools/muc-security/fixtures/payload-xss.csv").Path
          $marker = Join-Path ([IO.Path]::GetTempPath()) "tad-pwned.txt"
          Remove-Item $marker -ErrorAction SilentlyContinue
          Get-Process -Name Tad -ErrorAction SilentlyContinue | Stop-Process -Force
          $calcNames = "calc", "CalculatorApp", "Calculator", "win32calc"
          Get-Process -Name $calcNames -ErrorAction SilentlyContinue | Stop-Process -Force
          Add-Type -TypeDefinition @"
          using System; using System.Text; using System.Collections.Generic; using System.Runtime.InteropServices;
          public static class TadWin {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc cb, IntPtr l);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            public static List<string> Titles(int[] pids) {
              var set = new HashSet<uint>(); foreach (var p in pids) set.Add((uint)p);
              var r = new List<string>();
              EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p);
                if (set.Contains(p) && IsWindowVisible(h)) { var sb = new StringBuilder(512); GetWindowText(h, sb, 512); if (sb.Length > 0) r.Add(sb.ToString()); }
                return true; }, IntPtr.Zero);
              return r;
            }
          }
          "@ -ErrorAction SilentlyContinue
          Register-CimIndicationEvent -ClassName Win32_ProcessStartTrace -SourceIdentifier "TadWatch$Label"
          $env:ELECTRON_ENABLE_LOGGING = "1"
          $out = "runtime-test/$Label-stdout.log"; $err = "runtime-test/$Label-stderr.log"
          Start-Process -FilePath $Exe -ArgumentList "`"$csv`"" -RedirectStandardOutput $out -RedirectStandardError $err
          $rendered = $false
          for ($i = 0; $i -lt $Wait; $i += 5) {
            Start-Sleep -Seconds 5
            $ids = @(Get-Process -Name Tad -ErrorAction SilentlyContinue | ForEach-Object Id)
            if ($ids.Count -and (@([TadWin]::Titles([int[]]$ids)) -match "payload-xss")) { $rendered = $true; Start-Sleep -Seconds 10; break }
          }
          $tadIds = @(Get-Process -Name Tad -ErrorAction SilentlyContinue | ForEach-Object Id)
          $titles = if ($tadIds.Count) { @([TadWin]::Titles([int[]]$tadIds)) } else { @() }
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $vs = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $vs.Width, $vs.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($vs.Left, $vs.Top, 0, 0, $bmp.Size)
            $bmp.Save((Join-Path (Get-Location) "runtime-test/$Label.png"))
          } catch { "screenshot failed: $($_.Exception.Message)" }
          $started = @(Get-Event -SourceIdentifier "TadWatch$Label" -ErrorAction SilentlyContinue | ForEach-Object { $_.SourceEventArgs.NewEvent })
          Unregister-Event -SourceIdentifier "TadWatch$Label"
          $calc = @(Get-Process -Name $calcNames -ErrorAction SilentlyContinue).Count
          $children = @($started | Where-Object { $tadIds -contains [int]$_.ParentProcessID -and $_.ProcessName -notin @("Tad.exe", "conhost.exe") } | ForEach-Object ProcessName)
          $executed = (Test-Path $marker) -or ($calc -gt 0) -or ($children.Count -gt 0)
          Get-Process -Name Tad -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process -Name $calcNames -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          "=== [$Label] rendered=$rendered executed=$executed"
          "    windows : $($titles -join ' | ')"
          "    marker  : $(Test-Path $marker)   calculator processes: $calc   non-Tad children: $($children -join ', ')"
          "    --- Tad output (filtered) ---"
          Get-Content $out, $err -ErrorAction SilentlyContinue | Where-Object { $_ -match "error|warn|Rejected|CONSOLE|exception|openParams|fail" } | Select-Object -Last 40
          [pscustomobject]@{ Rendered = $rendered; Executed = $executed }
          '@ | Set-Content -Encoding utf8 runtime-test/Invoke-TadPayloadTest.ps1

      - name: Runtime security test - MUC build (payload CSV must not execute code)
        run: |
          $exe = (Resolve-Path "packages/tad-app/release/win-unpacked/Tad.exe").Path
          $r1 = & ./runtime-test/Invoke-TadPayloadTest.ps1 -Exe $exe -Label "muc-firstrun"
          $r2 = & ./runtime-test/Invoke-TadPayloadTest.ps1 -Exe $exe -Label "muc-secondrun"
          $r1 | Where-Object { $_ -is [string] }; $r2 | Where-Object { $_ -is [string] }
          $res = @($r1 + $r2 | Where-Object { $_ -isnot [string] })
          if ($res | Where-Object Executed) { throw "PAYLOAD EXECUTED in the MUC build" }
          if (-not ($res | Where-Object Rendered)) { throw "INCONCLUSIVE: the payload file was never rendered by the MUC build" }
          "RESULT: PASS - payload CSV rendered and did not execute code"

      - name: Positive control - official Tad 0.14.0 must execute the payload
        if: always()
        continue-on-error: true
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "Tad-Setup-0.14.0.exe"
          Invoke-WebRequest "https://github.com/antonycourtney/tad/releases/download/v0.14.0/Tad-Setup-0.14.0.exe" -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList "/S" -Wait
          $exe = @("$env:LOCALAPPDATA\Programs\Tad\Tad.exe", "$env:ProgramFiles\Tad\Tad.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "official Tad was not installed" }
          $r = & ./runtime-test/Invoke-TadPayloadTest.ps1 -Exe $exe -Label "official-0.14.0"
          $r | Where-Object { $_ -is [string] }
          $res = $r | Where-Object { $_ -isnot [string] }
          if (-not $res.Executed) { throw "CONTROL FAILED: the payload did not fire on official Tad, so this harness cannot detect execution" }
          "RESULT: CONTROL OK - official Tad executed the payload; the harness detects execution"

      - name: Compute SHA-256
        working-directory: packages/tad-app/release
        run: |
          $lines = Get-ChildItem -Filter *.exe | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          if (-not $lines) { throw "no installer produced" }
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt
          "### Tad MUC installer" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "Commit: ``$env:GITHUB_SHA``" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $lines | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $lines

      - name: Upload runtime test screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-test-${{ github.sha }}
          path: runtime-test/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tad-muc-windows-${{ github.sha }}
          path: |
            packages/tad-app/release/*.exe
            packages/tad-app/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
